name: Verify Satellite Drift
run-name: "Verify satellite drift: ${{ inputs.sha || github.event.workflow_run.head_branch || 'Source-Commit trailers' }}"

# Check that each satellite's HEAD (dotsecenv/plugin, dotsecenv/packages)
# is a signed release App commit holding exactly its monorepo directory,
# at a commit on main. releasetools/actions/verify-signed-push does this
# through GitHub's API, so nothing is checked out.
#
# This runs apart from release.yml because the release is already out by
# the time it runs. Drift is a signal to investigate, and a failure here
# should not mark a good release red.
#
# The expected monorepo commit is the dispatch input `sha`, else the tag
# commit the upstream Release published, else whatever each satellite's
# Source-Commit trailer names. It is never `github.sha`: main moves between
# releases without the satellites, so main's HEAD would report false drift.
# After a release, the release tag must also be signed and name that commit.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

  workflow_dispatch:
    inputs:
      sha:
        description: "Monorepo SHA to verify satellites against (default: each satellite's own Source-Commit trailer)"
        required: false
        default: ""

permissions: {}

jobs:
  # A failed release may have skipped the satellite publishes, and then the
  # satellites legitimately did not move.
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        satellite: [plugin, packages]
    steps:
      - name: Verify dotsecenv/${{ matrix.satellite }}
        uses: releasetools/actions/verify-signed-push@155dac3fe326bcdec985b9351788b43e82df0398  # v0.12.0
        with:
          repository: dotsecenv/${{ matrix.satellite }}
          commit: main
          source-repository: dotsecenv/dotsecenv
          source-path: ${{ matrix.satellite }}
          publisher: dotsecenv-automated-releases[bot]
          source-commit: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          tag: ${{ github.event.workflow_run.head_branch }}
