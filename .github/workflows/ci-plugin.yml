name: CI Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - ".github/workflows/ci-plugin.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugin/**"
      - ".github/workflows/ci-plugin.yml"

permissions: {}

jobs:
  shell-tests:
    name: Shell tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu covers both fish majors via the fish-shell PPAs. macOS
          # (Homebrew) only ships the current major, so it tracks fish 4.x.
          - os: ubuntu-24.04
            label: ubuntu-24.04 / fish 3.x
            fish_ppa: ppa:fish-shell/release-3
          - os: ubuntu-24.04
            label: ubuntu-24.04 / fish 4.x
            fish_ppa: ppa:fish-shell/release-4
          # ppa:fish-shell/release-3 has no 26.04 series, so this leg builds the
          # pinned fish 3 source release instead.
          - os: ubuntu-26.04
            label: ubuntu-26.04 / fish 3.x
            fish_source_version: 3.7.1
            fish_source_sha256: 614c9f5643cd0799df391395fa6bbc3649427bb839722ce3b114d3bbc1a3b250
          - os: ubuntu-26.04
            label: ubuntu-26.04 / fish 4.x
            fish_ppa: ppa:fish-shell/release-4
          - os: macos-26
            label: macos / fish 4.x
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Install fish (Ubuntu, from source)
        if: matrix.fish_source_version
        env:
          FISH_VERSION: ${{ matrix.fish_source_version }}
          FISH_SHA256: ${{ matrix.fish_source_sha256 }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libncurses-dev libpcre2-dev
          curl -sSfL -o "$RUNNER_TEMP/fish.tar.xz" \
            "https://github.com/fish-shell/fish-shell/releases/download/${FISH_VERSION}/fish-${FISH_VERSION}.tar.xz"
          echo "${FISH_SHA256}  $RUNNER_TEMP/fish.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/fish.tar.xz" -C "$RUNNER_TEMP"
          # fish 3.7.1 sets CMP0037 to OLD for an alias test target, which CMake 4 rejects.
          sed -i 's/^if(POLICY CMP0037)$/if(FALSE)/' "$RUNNER_TEMP/fish-${FISH_VERSION}/cmake/Tests.cmake"
          cmake -S "$RUNNER_TEMP/fish-${FISH_VERSION}" -B "$RUNNER_TEMP/fish-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DWITH_GETTEXT=OFF
          cmake --build "$RUNNER_TEMP/fish-build" -j"$(nproc)"
          sudo cmake --install "$RUNNER_TEMP/fish-build"
          fish --version

      - name: Install fish (Ubuntu, PPA)
        if: runner.os == 'Linux' && matrix.fish_ppa
        run: |
          sudo apt-add-repository ${{ matrix.fish_ppa }} -y
          sudo apt-get update
          sudo apt-get install -y fish
          fish --version

      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install fish
          fish --version

      - name: Install bash 5 (macOS)
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test plugins
        run: make test-plugins

      # `make test-managers` is intentionally not run here. It builds a Docker
      # image and runs `git clone /opt/dotsecenv-plugin` inside it, which only
      # works when plugin/ is its own git repo. In the monorepo plugin/ is a
      # subdirectory and has no .git, so the clone fails. The plugin satellite
      # (dotsecenv/plugin) continues to run `make test-managers` on every push
      # via its own ci.yml, and the release pipeline pushes the latest source
      # there before tagging — so the integration coverage is preserved.
