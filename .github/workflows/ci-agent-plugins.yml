name: CI Agent Plugins

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - "skills/**"
      - "scripts/set-plugin-version.sh"
      - "scripts/validate-agent-plugins.sh"
      - "scripts/test-agent-plugins.sh"
      - ".github/workflows/ci-agent-plugins.yml"
  pull_request:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - "skills/**"
      - "scripts/set-plugin-version.sh"
      - "scripts/validate-agent-plugins.sh"
      - "scripts/test-agent-plugins.sh"
      - ".github/workflows/ci-agent-plugins.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check shell syntax
        run: |
          bash -n scripts/set-plugin-version.sh
          bash -n scripts/validate-agent-plugins.sh
          bash -n scripts/test-agent-plugins.sh

      - name: Validate packaging
        run: scripts/validate-agent-plugins.sh

      - name: Test version synchronization
        run: scripts/test-agent-plugins.sh
