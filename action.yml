# https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax
name: 'Setup dotsecenv'
description: 'Download and verify dotsecenv release binaries, or build from source'
author: 'dotsecenv'

branding:
  icon: 'lock'
  color: 'green'

inputs:
  version:
    description: 'Version to install: a release tag (e.g., v1.2.3), branch ref (e.g., main), commit SHA, or "latest" for the most recent release'
    required: false
    default: 'latest'
  build-from-source:
    description: 'Build from source instead of using pre-built release binaries'
    required: false
    default: 'false'
  verify-provenance:
    description: 'Verify attestations, checksums, and GPG signatures (ignored if build-from-source is true)'
    required: false
    default: 'true'
  init-config:
    description: 'Arguments for "dotsecenv init config". Set to empty string to run with defaults, or provide flags (e.g., "--login FINGERPRINT"). Leave as "skip" to not run.'
    required: false
    default: 'skip'

outputs:
  version:
    description: 'The version of dotsecenv that was installed'
    value: ${{ steps.resolve-version.outputs.version }}
  binary-path:
    description: 'Full path to the installed binary'
    value: ${{ steps.install-release.outputs.binary-path || steps.install-source.outputs.binary-path }}

runs:
  using: 'composite'
  steps:
    # ============================================
    # Resolve version
    # ============================================
    - name: Resolve version
      id: resolve-version
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [[ "$INPUT_VERSION" == "latest" ]]; then
          VERSION=$(gh release view --repo dotsecenv/dotsecenv --json tagName -q .tagName)
          echo "Resolved latest released version: $VERSION"
        else
          VERSION="$INPUT_VERSION"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    # ===========================================================
    # Download release
    # ===========================================================
    - name: Determine architecture
      id: arch
      if: inputs.build-from-source != 'true'
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux)  echo "os=Linux" >> "$GITHUB_OUTPUT" ;;
          macOS)  echo "os=Darwin" >> "$GITHUB_OUTPUT" ;;
          *)      echo "::error::Unsupported OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)    echo "arch=x86_64" >> "$GITHUB_OUTPUT" ;;
          ARM64)  echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
          *)      echo "::error::Unsupported arch: $RUNNER_ARCH"; exit 1 ;;
        esac

    - name: Download release
      id: download
      if: inputs.build-from-source != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.resolve-version.outputs.version }}
        OS: ${{ steps.arch.outputs.os }}
        ARCH: ${{ steps.arch.outputs.arch }}
      run: |
        ARCHIVE="dotsecenv_${VERSION#v}_${OS}_${ARCH}.tar.gz"
        DEST="$RUNNER_TEMP/dotsecenv-download"
        mkdir -p "$DEST"

        gh release download "$VERSION" --repo dotsecenv/dotsecenv --pattern "$ARCHIVE" --pattern "checksums.txt*" --dir "$DEST"

        echo "dir=$DEST" >> "$GITHUB_OUTPUT"
        echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

    # Reuses the installer's checks: the key comes over HTTPS, the signature must
    # be from a fingerprint pinned in scripts/install.sh, and any failure stops.
    - name: Verify GPG signature and checksum
      if: inputs.build-from-source != 'true' && inputs.verify-provenance == 'true'
      shell: bash
      working-directory: ${{ steps.download.outputs.dir }}
      env:
        ARCHIVE: ${{ steps.download.outputs.archive }}
        NO_VERIFY_HINT: "set verify-provenance: false to skip verification"
      run: |
        source "$GITHUB_ACTION_PATH/scripts/install.sh"
        detect_downloader
        verify_gpg checksums.txt checksums.txt.sig
        verify_checksums "$ARCHIVE" checksums.txt

    - name: Verify attestation
      if: inputs.build-from-source != 'true' && inputs.verify-provenance == 'true'
      shell: bash
      working-directory: ${{ steps.download.outputs.dir }}
      env:
        GH_TOKEN: ${{ github.token }}
        ARCHIVE: ${{ steps.download.outputs.archive }}
      run: gh attestation verify "$ARCHIVE" --repo dotsecenv/dotsecenv

    - name: Install release binary
      id: install-release
      if: inputs.build-from-source != 'true'
      shell: bash
      env:
        ARCHIVE_PATH: ${{ steps.download.outputs.dir }}/${{ steps.download.outputs.archive }}
      run: |
        INSTALL_DIR="$RUNNER_TEMP/dotsecenv-bin"
        mkdir -p "$INSTALL_DIR"
        tar -xzf "$ARCHIVE_PATH" -C "$INSTALL_DIR"
        chmod +x "$INSTALL_DIR/dotsecenv"
        "$INSTALL_DIR/dotsecenv" version
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        echo "binary-path=$INSTALL_DIR/dotsecenv" >> "$GITHUB_OUTPUT"

    # ============================================
    # Build from source path
    # ============================================
    - name: Checkout the source code
      id: checkout
      if: inputs.build-from-source == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.resolve-version.outputs.version }}
      run: |
        DEST="$RUNNER_TEMP/dotsecenv-download"

        # Try branch/tag clone first, fall back to SHA checkout
        if git clone --depth 1 --branch "$VERSION" https://github.com/dotsecenv/dotsecenv.git "$DEST" 2>/dev/null; then
          echo "Cloned branch/tag: $VERSION"
        else
          echo "Branch/tag not found, trying as commit SHA: $VERSION"
          git clone --no-checkout --depth 1 https://github.com/dotsecenv/dotsecenv.git "$DEST"
          git -C "$DEST" fetch --depth 1 origin "$VERSION"
          git -C "$DEST" checkout FETCH_HEAD
        fi

        echo "dir=$DEST" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      if: inputs.build-from-source == 'true'
      uses: actions/setup-go@v7
      with:
        go-version-file: "${{ steps.checkout.outputs.dir }}/go.mod"
        # Disable module caching: the source is cloned into ${{ runner.temp }},
        # which is outside $GITHUB_WORKSPACE. @actions/glob (used by setup-go
        # to expand `cache-dependency-path`) can't resolve absolute paths
        # outside the workspace and emits a "paths were not resolved"
        # warning. The build-from-source path is a one-shot CI build into a
        # temp dir anyway, so a cache would have no hit rate worth optimising.
        cache: false

    - name: Build from source
      if: inputs.build-from-source == 'true'
      working-directory: ${{ steps.checkout.outputs.dir }}
      shell: bash
      run: |
        make build

    - name: Install source binary
      id: install-source
      if: inputs.build-from-source == 'true'
      working-directory: ${{ steps.checkout.outputs.dir }}
      shell: bash
      run: |
        INSTALL_DIR="$RUNNER_TEMP/dotsecenv-bin"
        mkdir -p "$INSTALL_DIR"
        cp bin/dotsecenv "$INSTALL_DIR/dotsecenv"
        chmod +x "$INSTALL_DIR/dotsecenv"
        "$INSTALL_DIR/dotsecenv" version
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        echo "binary-path=$INSTALL_DIR/dotsecenv" >> "$GITHUB_OUTPUT"

    # ============================================
    # Initialize config (optional)
    # ============================================
    - name: Initialize config
      if: inputs.init-config != 'skip'
      shell: bash
      env:
        INIT_CONFIG: ${{ inputs.init-config }}
      run: |
        # Split on whitespace into separate flags, with no shell expansion.
        read -ra args <<< "$INIT_CONFIG"
        dotsecenv init config "${args[@]}"
